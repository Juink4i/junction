[project]
name = "valio-aimo-trade"
version = "0.1.0"
description = "Junction 2026: trusted trade agents for Valio Aimo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["catalog", "server", "agent"]
